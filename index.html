<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-palette="purple" class="is-loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f7fb">
<meta name="description" content="YiKlot 数字华容道：支持多格连推、提示与撤销的离线单文件解谜游戏，含 3×3 至 6×6 四档难度。">
<title>YiKlot Web · 数字华容道</title>
<script>
  // 先于渲染应用主题，避免闪烁
  (function () {
    try {
      var t = localStorage.getItem('yk-theme');
      if (t !== 'light' && t !== 'dark') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
      var p = localStorage.getItem('yk-palette');
      if (/^(purple|blue|cyan|green|yellow|orange|pink|red)$/.test(p || '')) {
        document.documentElement.dataset.palette = p;
      }
    } catch (e) {}
  })();
</script>
<style>
  /* ============ Material You 色彩令牌（基于 OKLCH 动态生成） ============ */
  :root, [data-palette="purple"] { --h: 295; --c: .16; }
  [data-palette="blue"]   { --h: 255; --c: .15; }
  [data-palette="cyan"]   { --h: 200; --c: .11; }
  [data-palette="green"]  { --h: 150; --c: .14; }
  [data-palette="yellow"] { --h: 90;  --c: .13; }
  [data-palette="orange"] { --h: 55;  --c: .14; }
  [data-palette="pink"]   { --h: 350; --c: .15; }
  [data-palette="red"]    { --h: 25;  --c: .17; }

  [data-theme="light"] {
    color-scheme: light;
    --primary: oklch(.46 calc(var(--c) * 1.1) var(--h));
    --on-primary: oklch(.985 .01 var(--h));
    --primary-container: oklch(.9 calc(var(--c) * .5) var(--h));
    --on-primary-container: oklch(.26 calc(var(--c) * .9) var(--h));
    --secondary-container: oklch(.9 .028 var(--h));
    --on-secondary-container: oklch(.27 .04 var(--h));
    --tertiary: oklch(.5 .14 calc(var(--h) + 70));
    --tertiary-container: oklch(.9 .07 calc(var(--h) + 70));
    --on-tertiary-container: oklch(.26 .09 calc(var(--h) + 70));
    --surface: oklch(.985 .004 var(--h));
    --surface-lowest: oklch(.99 .003 var(--h));
    --surface-low: oklch(.955 .01 var(--h));
    --surface-mid: oklch(.935 .014 var(--h));
    --surface-high: oklch(.9 .02 var(--h));
    --surface-highest: oklch(.87 .024 var(--h));
    --tile: oklch(.992 .004 var(--h));
    --tile-ok: color-mix(in oklch, var(--primary-container) 62%, var(--tile));
    --on-tile-ok: var(--on-primary-container);
    --slot: oklch(.855 .022 var(--h));
    --on-surface: oklch(.2 .02 var(--h));
    --on-surface-variant: oklch(.42 .03 var(--h));
    --outline: oklch(.55 .03 var(--h));
    --outline-variant: oklch(.8 .03 var(--h));
    --shadow: 0 1px 2px oklch(.2 .03 var(--h) / .16), 0 2px 6px oklch(.2 .03 var(--h) / .08);
    --glow: oklch(.85 .08 var(--h) / .55);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --primary: oklch(.8 calc(var(--c) * .72) var(--h));
    --on-primary: oklch(.29 calc(var(--c) * .7) var(--h));
    --primary-container: oklch(.38 calc(var(--c) * .65) var(--h));
    --on-primary-container: oklch(.92 .05 var(--h));
    --secondary-container: oklch(.36 .035 var(--h));
    --on-secondary-container: oklch(.92 .02 var(--h));
    --tertiary: oklch(.82 .11 calc(var(--h) + 70));
    --tertiary-container: oklch(.4 .08 calc(var(--h) + 70));
    --on-tertiary-container: oklch(.93 .06 calc(var(--h) + 70));
    --surface: oklch(.17 .012 var(--h));
    --surface-lowest: oklch(.13 .01 var(--h));
    --surface-low: oklch(.2 .015 var(--h));
    --surface-mid: oklch(.23 .018 var(--h));
    --surface-high: oklch(.27 .02 var(--h));
    --surface-highest: oklch(.31 .022 var(--h));
    --tile: oklch(.35 .024 var(--h));
    --tile-ok: oklch(.42 calc(var(--c) * .62) var(--h));
    --on-tile-ok: var(--on-primary-container);
    --slot: oklch(.225 .018 var(--h));
    --on-surface: oklch(.93 .01 var(--h));
    --on-surface-variant: oklch(.8 .025 var(--h));
    --outline: oklch(.62 .03 var(--h));
    --outline-variant: oklch(.4 .03 var(--h));
    --shadow: 0 1px 2px #0006, 0 2px 8px #0003;
    --glow: oklch(.38 .1 var(--h) / .55);
  }

  /* ============ 基础 ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html { -webkit-tap-highlight-color: transparent; scrollbar-gutter: stable; }
  body {
    min-height: 100dvh;
    font-family: "Nebulove", "Yomi-UI-Emoji", "Google Sans", "Roboto", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--on-surface);
    background:
      radial-gradient(70% 45% at 88% 8%, var(--glow), transparent 70%),
      var(--surface);
    background-attachment: fixed;
    transition: background-color .3s, color .3s;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; outline: none; }
  button:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; }
  html.kb button:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; }
  svg { display: block; }
  .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ico.fill { fill: currentColor; stroke: none; }

  /* ============ 顶栏 ============ */
  .appbar { position: sticky; top: 0; z-index: 30; background: color-mix(in oklch, var(--surface-lowest) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); contain: layout paint; }
  .bar-inner { position: relative; max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px clamp(16px, 4vw, 32px); }
  .logo { width: 48px; height: 48px; border-radius: 16px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; box-shadow: var(--shadow); }
  .logo svg { width: 28px; height: 28px; }
  .brand { font-size: clamp(20px, 5vw, 26px); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .badge { font-size: 13px; font-weight: 600; padding: 3px 12px; border-radius: 999px; background: var(--primary-container); color: var(--on-primary-container); flex: none; }
  .bar-actions { margin-left: auto; display: flex; gap: 4px; flex: none; }
  .anchor { position: relative; }
  .icon-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--on-surface); transition: background .2s, transform .15s; }
  .icon-btn:hover { background: color-mix(in oklch, var(--on-surface) 8%, transparent); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn[aria-expanded="true"] { background: var(--surface-high); }
  .icon-btn .ico { width: 26px; height: 26px; }
  .brand-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
  @media (max-width: 380px) {
    .badge { display: none; }
    .logo { width: 42px; height: 42px; border-radius: 14px; }
    .logo svg { width: 24px; height: 24px; }
    .icon-btn { width: 42px; height: 42px; }
    .bar-inner { gap: 8px; }
  }

  .popover {
    position: absolute; top: calc(100% + 6px); z-index: 40;
    background: var(--surface-high); color: var(--on-surface);
    border-radius: 24px; padding: 14px; box-shadow: 0 8px 28px #0004;
    opacity: 0; visibility: hidden; transform: scale(.88); transform-origin: top right;
    transition: opacity .18s, transform .22s cubic-bezier(.2,.9,.3,1.2), visibility .18s;
  }
  .popover.open { opacity: 1; visibility: visible; transform: none; }
  #palettePop { right: -56px; width: min(280px, calc(100vw - 32px)); padding: 18px 18px 20px; }
  #menuPop { right: 0; width: min(230px, calc(100vw - 32px)); padding: 8px; }
  .pop-title { font-size: 14px; font-weight: 600; color: var(--on-surface-variant); letter-spacing: .08em; margin-bottom: 14px; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatch { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: oklch(.2 .05 var(--sh)); background: oklch(.74 .14 var(--sh)); transition: transform .15s; border: 3px solid transparent; }
  .swatch:hover { transform: scale(1.06); }
  .swatch.on { border-color: var(--on-surface); box-shadow: inset 0 0 0 3px var(--surface-high); }
  .swatch svg { width: 24px; height: 24px; opacity: 0; }
  .swatch.on svg { opacity: 1; }
  .menu-item { display: flex; align-items: center; gap: 16px; width: 100%; padding: 14px 16px; border-radius: 16px; font-size: 16px; font-weight: 500; text-align: left; transition: background .15s; }
  .menu-item:hover { background: color-mix(in oklch, var(--on-surface) 8%, transparent); }
  .menu-item .ico { color: var(--on-surface-variant); flex: none; }

  /* ============ 页面自适应布局 ============ */
  main { max-width: 1200px; margin: 0 auto; padding: clamp(12px, 2.2vh, 18px) clamp(16px, 4vw, 32px) calc(32px + env(safe-area-inset-bottom)); }
  .layout { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 20px); }
  .side { display: contents; }
  .title-row { order: 1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .stats { order: 2; }
  .board-col { order: 3; display: flex; justify-content: center; }
  .tools { order: 4; }
  .diffs { order: 5; }
  .hints { order: 6; }

  @media (min-width: 920px) {
    main { padding-top: 28px; }
    .layout { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 460px); gap: clamp(28px, 4vw, 56px); align-items: center; min-height: calc(100dvh - 190px); }
    .side { display: flex; flex-direction: column; gap: 22px; }
    .board-col { order: 0; }
  }
  @media (min-width: 660px) and (max-width: 919px) and (max-height: 540px) {
    main { padding-top: 10px; padding-bottom: 18px; }
    .layout { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 340px); gap: 24px; align-items: center; }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .board-col { order: 0; }
  }

  h1 { font-size: clamp(32px, 8.5vw, 46px); font-weight: 800; letter-spacing: .02em; line-height: 1.1; }
  .subtitle { font-size: clamp(16px, 4.2vw, 18px); font-weight: 700; color: var(--on-surface-variant); }

  /* 统计卡片 */
  .stats { display: flex; align-items: center; gap: 10px; }
  .stat { flex: 1; min-width: 0; border-radius: 28px; padding: 14px 6px 13px; text-align: center; transition: background .3s; }
  .stat.a { background: var(--surface-highest); color: var(--on-surface); }
  .stat.b { background: var(--primary-container); color: var(--on-primary-container); }
  .stat .lb { font-size: 14px; font-weight: 600; letter-spacing: .12em; opacity: .85; }
  .stat .val { font-size: clamp(24px, 6.8vw, 34px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 2px; white-space: nowrap; }
  .round { width: 54px; height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center; transition: transform .15s, background .2s, opacity .2s, box-shadow .2s; }
  .round:active { transform: scale(.9); }
  .round.tonal { background: var(--surface-highest); color: var(--on-surface); }
  .round.tonal:hover { background: color-mix(in oklch, var(--surface-highest) 85%, var(--on-surface)); }
  .round.filled { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow); }
  .round.filled:hover { box-shadow: 0 3px 10px oklch(.2 .05 var(--h) / .3); }
  .round:disabled, .tool:disabled { opacity: .38; pointer-events: none; }
  @media (max-width: 400px) {
    .round { width: 46px; height: 46px; }
    .stats { gap: 7px; }
    .stat { border-radius: 24px; padding: 11px 4px 10px; }
  }

  /* 棋盘 */
  .board {
    --pad: clamp(8px, 2.2vw, 14px);
    width: min(100%, 480px, max(260px, calc(100dvh - 385px)));
    padding: var(--pad);
    border-radius: clamp(22px, 5vw, 32px);
    background: var(--surface-high);
    container-type: inline-size;
    transition: background .3s;
  }
  @media (min-width: 920px) {
    .board { width: min(100%, max(280px, calc(100dvh - 175px))); }
  }
  @media (min-width: 660px) and (max-width: 919px) and (max-height: 540px) {
    .board { width: min(100%, max(220px, calc(100dvh - 104px))); }
  }
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--rows), 1fr);
    aspect-ratio: 1 / 1;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .cell {
    position: relative;
    padding: 0;
    outline: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  .cell::before {
    content: "";
    position: absolute;
    inset: 5%;
    display: grid;
    place-items: center;
    border-radius: calc(100cqw / var(--cols) * .24);
    background: var(--slot);
    font-size: calc(100cqw / var(--cols) * .34);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: color-mix(in oklch, var(--on-surface-variant) 34%, transparent);
    pointer-events: none;
    transition: background .25s;
  }
  .grid.mark .cell.empty::before { content: attr(data-goal); }

  .tile {
    position: absolute;
    inset: 5%;
    display: grid;
    place-items: center;
    border-radius: calc(100cqw / var(--cols) * .24);
    background: var(--tile);
    color: var(--on-surface);
    box-shadow: var(--shadow);
    font-size: calc(100cqw / var(--cols) * .42);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    z-index: 1;
    transition: transform .16s cubic-bezier(.3, 1.4, .5, 1), background-color .22s, color .22s, box-shadow .2s;
  }
  .cell.movable { cursor: pointer; }
  .cell.movable:hover .tile { transform: translateY(-1.5px); }
  .cell.movable:active .tile { transform: scale(.93); }
  .cell.empty { pointer-events: none; }
  .cell.empty .tile { visibility: hidden; }
  .grid.mark .cell.ok:not(.empty) .tile {
    background: var(--tile-ok);
    color: var(--on-tile-ok);
  }
  .cell.hint .tile {
    animation: hintPulse .9s ease-in-out infinite;
    background: var(--tertiary-container) !important;
    color: var(--on-tertiary-container) !important;
    z-index: 3;
  }
  .cell.shake .tile { animation: shake .34s; }
  .grid.shuffling .cell:not(.empty) .tile {
    animation: reshuffle .46s cubic-bezier(.3, 1.3, .5, 1) backwards;
    animation-delay: calc(var(--d, 0) * 14ms);
  }
  .grid.winning .cell:not(.empty) .tile {
    animation: winWave .62s cubic-bezier(.25, 1.35, .5, 1) calc(var(--d, 0) * 38ms);
  }
  @keyframes hintPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 var(--tertiary), var(--shadow); }
    50% { transform: scale(1.07); box-shadow: 0 0 0 max(2.5px, calc(100cqw / var(--cols) * .055)) var(--tertiary), var(--shadow); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6%); }
    40% { transform: translateX(6%); }
    60% { transform: translateX(-4%); }
    80% { transform: translateX(3%); }
  }
  @keyframes reshuffle {
    0% { transform: scale(.45); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes winWave {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.1); background: var(--primary); color: var(--on-primary); z-index: 4; }
  }

  /* 工具按钮 */
  .tools { display: flex; gap: 12px; }
  .tool {
    flex: 1; min-width: 0; min-height: 56px; padding: 0 12px; border-radius: 22px;
    background: var(--surface-highest); color: var(--on-surface);
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-weight: 600; font-size: clamp(15px, 4vw, 16px); white-space: nowrap;
    transition: transform .15s, background .2s, opacity .2s;
  }
  .tool:hover { background: color-mix(in oklch, var(--surface-highest) 85%, var(--on-surface)); }
  .tool:active { transform: scale(.96); }
  .tool .ico { flex: none; }
  .tool .chip { min-width: 28px; padding: 1px 8px; border-radius: 999px; font-size: 13px; background: var(--surface-high); text-align: center; font-variant-numeric: tabular-nums; transition: background .2s, color .2s; }
  .tool.active .chip { background: var(--primary-container); color: var(--on-primary-container); }

  /* 难度 */
  .diffs { display: flex; flex-wrap: wrap; gap: clamp(7px, 2vw, 10px); justify-content: center; }
  .chip-btn {
    height: 46px; padding: 0 clamp(14px, 4vw, 22px); border-radius: 18px;
    border: 2px solid var(--outline); display: inline-flex; align-items: center; gap: 7px;
    font-size: clamp(15px, 4vw, 16px); font-weight: 700; white-space: nowrap;
    transition: background .2s, border-color .2s, transform .15s, padding .2s; color: var(--on-surface);
  }
  .chip-btn:hover { background: color-mix(in oklch, var(--on-surface) 7%, transparent); }
  .chip-btn:active { transform: scale(.95); }
  .chip-btn.on { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; padding: 0 clamp(14px, 4vw, 22px) 0 clamp(11px, 3vw, 16px); }
  .chip-btn .ico { width: 20px; height: 20px; stroke-width: 2.6; display: none; flex: none; }
  .chip-btn.on .ico { display: block; }

  .hints { text-align: center; color: var(--on-surface-variant); font-size: clamp(14px, 3.6vw, 15px); line-height: 2.05; }
  .hints p + p { margin-top: 2px; }
  .kh { white-space: nowrap; }
  kbd { display: inline-block; min-width: 1.85em; padding: 0 6px; margin: 0 1px; border: 1px solid var(--outline); border-radius: 8px; font: inherit; font-size: .84em; line-height: 1.7; text-align: center; color: var(--on-surface-variant); }
  @media (hover: none) { .kbd-line { display: none; } }

  /* 对话框：backdrop 在低端机上可降级为纯色以减少重绘 */
  dialog { margin: auto; border: 0; padding: 28px 28px 22px; width: min(92vw, 420px); border-radius: 32px; background: var(--surface-high); color: var(--on-surface); box-shadow: 0 16px 48px #0006; }
  dialog::backdrop { background: oklch(.1 .02 var(--h) / .45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  @supports not (backdrop-filter: blur(8px)) {
    dialog::backdrop { background: oklch(.1 .02 var(--h) / .68); }
  }
  dialog[open] { animation: dlgIn .28s cubic-bezier(.2,.9,.3,1.15); }
  dialog[open]::backdrop { animation: fadeIn .25s; }
  dialog[open].closing { animation: dlgOut .22s cubic-bezier(.4,0,1,1) forwards; pointer-events: none; }
  dialog[open].closing::backdrop { animation: fadeOut .22s ease forwards; }
  @keyframes dlgIn { from { opacity: 0; transform: scale(.88) translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); } }
  @keyframes dlgOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.9) translateY(10px); } }
  @keyframes fadeOut {
    from { opacity: 1; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    to { opacity: 0; backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
  }
  .dlg-icon { width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 24px; background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; }
  .dlg-icon .ico { width: 34px; height: 34px; }
  dialog h2 { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 14px; }
  .dlg-body { font-size: 16px; line-height: 1.85; color: var(--on-surface-variant); }
  .dlg-body b { color: var(--on-surface); }
  .dlg-body p + p { margin-top: 4px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
  .btn { height: 48px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: 16px; transition: transform .15s, background .2s; }
  .btn:active { transform: scale(.94); }
  .btn.text { color: var(--primary); }
  .btn.text:hover { background: color-mix(in oklch, var(--primary) 10%, transparent); }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .rec { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 18px; background: var(--surface-mid); }
  .rec + .rec { margin-top: 8px; }
  .rec .n { font-weight: 600; color: var(--on-surface); flex: 1; white-space: nowrap; }
  .rec .t { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--primary); }
  .rec .w { font-size: 13px; min-width: 78px; text-align: right; font-variant-numeric: tabular-nums; }
  .win-time { text-align: center; }
  .win-time .big { font-size: 44px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.2; margin: 2px 0; }
  .win-meta { font-size: 15px; font-weight: 600; color: var(--on-surface); margin-bottom: 4px; font-variant-numeric: tabular-nums; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 60; transform: translate(-50%, 20px); background: var(--on-surface); color: var(--surface); padding: 12px 22px; border-radius: 16px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.2); max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 6px 20px #0004; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ============ 加载覆盖层 ============ */
  html.is-loading { overflow: hidden; }
  .loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    padding: 24px; text-align: center;
    background: radial-gradient(70% 45% at 88% 8%, var(--glow), transparent 70%), var(--surface);
    transition: opacity .4s ease, visibility .4s ease;
  }
  .loader-hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-mark { position: relative; width: clamp(72px, 24vw, 96px); aspect-ratio: 1 / 1; display: grid; place-items: center; transition: transform .4s cubic-bezier(.2,.9,.3,1.2); }
  .loader-ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: ykSpin 1.1s linear infinite; }
  .loader-ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
  .loader-ring .track { stroke: var(--surface-highest); }
  .loader-ring .arc { stroke: var(--primary); stroke-dasharray: 60 210; animation: ykDash 1.5s ease-in-out infinite; }
  .loader-logo { width: 40%; height: 40%; color: var(--primary); }
  .loader-text { font-size: 15px; font-weight: 600; letter-spacing: .04em; color: var(--on-surface-variant); }
  .loader-hide .loader-mark { transform: scale(.88); }
  @keyframes ykSpin { to { transform: rotate(360deg); } }
  @keyframes ykDash {
    0%   { stroke-dasharray: 10 260; stroke-dashoffset: 0; }
    50%  { stroke-dasharray: 150 120; }
    100% { stroke-dasharray: 10 260; stroke-dashoffset: -270; }
  }
  /* 减弱动效时保留转圈（放慢），否则转圈会因全局 .01ms 规则变成静止的坏掉的环 */
  @media (prefers-reduced-motion: reduce) {
    .loader-ring { animation-duration: 2.6s !important; }
    .loader-ring .arc { animation-duration: 2.6s !important; }
  }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

<script>
  /* ---------- 加载覆盖层控制：window.load + document.fonts 全部就绪后淡出 ---------- */
  (function () {
    var MIN_MS = 420;    /* 最短展示时间，避免一闪而过 */
    var MAX_MS = 15000;  /* 兜底：异常情况下也要放行 */
    var t0 = (window.performance && performance.now()) || Date.now();
    var now = function () { return (window.performance && performance.now()) || Date.now(); };
    var loader = document.getElementById('loader');
    var hidden = false, waiters = [];

    function hide() {
      if (hidden) return;
      hidden = true;
      document.documentElement.classList.remove('is-loading');
      loader.classList.add('loader-hide');
      setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 600);
      var list = waiters; waiters = [];
      for (var i = 0; i < list.length; i++) { try { list[i](); } catch (e) {} }
    }
    function finish() {
      var left = MIN_MS - (now() - t0);
      if (left > 0) setTimeout(hide, left); else hide();
    }

    window.YKReady = {
      whenReady: function (cb) { if (hidden) { cb(); return; } waiters.push(cb); },
      hide: hide
    };

    var winLoaded = false, fontsLoaded = false, triggered = false;
    function check() { if (!triggered && winLoaded && fontsLoaded) { triggered = true; finish(); } }

    /* 1) 页面全部资源 */
    if (document.readyState === 'complete') { winLoaded = true; check(); }
    else window.addEventListener('load', function () { winLoaded = true; check(); });

    /* 2) 字体：内联的 Nebulove 子集 + Yomi-UI-Emoji 子集 */
    var jobs = [];
    if (document.fonts && document.fonts.load) {
      try {
        jobs.push(document.fonts.load('700 20px Nebulove', '正在加载资源 0123456789 YiKlot 数字华容道 用时 步数 提示 标位 简单 中等 困难 专家'));
        jobs.push(document.fonts.load('16px "Yomi-UI-Emoji"', '❤️🎉'));
      } catch (e) {}
      if (document.fonts.ready) jobs.push(document.fonts.ready);
    }
    if (window.Promise) {
      Promise.all(jobs).then(function () { fontsLoaded = true; check(); },
                            function () { fontsLoaded = true; check(); });
    } else { fontsLoaded = true; check(); }

    setTimeout(hide, MAX_MS);
  })();
</script>

      return mem.has(k) ? mem.get(k) : d;
    },
    set(k, v) {
      const s = String(v);
      mem.set(k, s);
      try { localStorage.setItem(k, s); } catch (e) {}
    },
    del(k) {
      mem.delete(k);
      try { localStorage.removeItem(k); } catch (e) {}

  };
  const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

  /* ---------- 记录 ---------- */
  /* 读取最佳成绩并规整字段，避免被手改或旧版本残留的脏数据污染界面 */
  const safeNum = (v, d = 0) => (typeof v === 'number' && Number.isFinite(v) && v >= 0 ? Math.round(v) : d);
  function loadBest() {
    try {

  function showHelp() {

             <p>「提示」会自动计算并高亮下一步最优移动方块，再次点击可直接走这一步；「标位」可高亮已归位的数字并在空位提示目标序号。</p>

  /* ---------- 可解性校验与求解引擎 ---------- */
  function isSolvable(flat, n) {
    // 奇数盘：逆序数偶数方可解；偶数盘：逆序数 + 空白行距底行距离 的奇偶决定
    // 已验证：解态 [1..N²-1,0] 返回 true，对调 14/15 返回 false
    let inv = 0, blankRow = 0;
    for (let i = 0; i < flat.length; i++) {
      const a = flat[i];
      if (!a) { blankRow = (i / n) | 0; continue; }
      for (let j = i + 1; j < flat.length; j++) {
        const b = flat[j];
        if (b && a > b) inv++;
      }
    }
    const blankParity = (n - 1 - blankRow) & 1;
    const needEven = ((n - 1) & 1) === 0; // 奇数盘无需考虑空白行
    return ((inv + (needEven ? 0 : blankParity)) & 1) === 0;
  }

  function isSolvedFlat(flat) {
    for (let i = 0; i < flat.length - 1; i++) if (flat[i] !== i + 1) return false;
    return flat[flat.length - 1] === 0;
  }

  function manhattanTotal(flat, n) {
    let sum = 0;
    for (let i = 0; i < flat.length; i++) {
      const v = flat[i];
      if (!v) continue;
      const r = (i / n) | 0, c = i % n;
      const gr = ((v - 1) / n) | 0, gc = (v - 1) % n;
      sum += Math.abs(r - gr) + Math.abs(c - gc);
    }
    return sum;
  }

  /* 子目标精确最短路 BFS（单块或行末/列末双块联合归位） */
  function bfsSubgoal(flat, n, locked, valA, goalA, valB, goalB) {
    const total = n * n;
    const startBlank = flat.indexOf(0);
    const startA = flat.indexOf(valA);
    const startB = valB < 0 ? 0 : flat.indexOf(valB);
    if (valB < 0 && startA === goalA) return -1;
    if (valB >= 0 && startA === goalA && startB === goalB) return -1;

    // 状态空间 = 空白×目标A(×目标B)；使用更宽的 Int32 存 firstMove 以兼容 6×6 双目标 46k 状态
    const multB = valB < 0 ? 1 : total;
    const maxStates = total * total * multB;
    const seen = new Uint8Array(maxStates);
    const firstMove = new Int32Array(maxStates).fill(-1);
    const q = new Int32Array(maxStates);
    const encode = (b, a, bb) => (b * total + a) * multB + bb;

    const s0 = encode(startBlank, startA, startB);
    seen[s0] = 1;
    let head = 0, tail = 0;
    q[tail++] = s0;

    while (head < tail) {
      const s = q[head++];
      const bb = valB < 0 ? 0 : s % multB;
      const rem = valB < 0 ? s : (s / multB) | 0;
      const a = rem % total;
      const b = (rem / total) | 0;
      const br = (b / n) | 0, bc = b % n;

      for (let d = 0; d < 4; d++) {
        const nr = br + (d === 0 ? -1 : d === 1 ? 1 : 0);
        const nc = bc + (d === 2 ? -1 : d === 3 ? 1 : 0);
        if (nr < 0 || nr >= n || nc < 0 || nc >= n) continue;
        const nb = nr * n + nc;
        if (locked[nb]) continue;
        const na = nb === a ? b : a;
        const nbb = valB < 0 ? 0 : (nb === bb ? b : bb);
        const ns = encode(nb, na, nbb);
        if (seen[ns]) continue;
        seen[ns] = 1;
        const fm = firstMove[s] === -1 ? nb : firstMove[s];
        firstMove[ns] = fm;
        if (na === goalA && (valB < 0 || nbb === goalB)) return fm;
        q[tail++] = ns;
      }
    }
    return -1;
  }

  /* 3×3 终局 IDA* 最优求解（含曼哈顿距离 + 线性冲突启发函数） */
  const NBRS_3 = [
    [1, 3], [0, 2, 4], [1, 5],
    [0, 4, 6], [1, 3, 5, 7], [2, 4, 8],
    [3, 7], [4, 6, 8], [5, 7]
  ];
  function solve3x3(flat, n) {
    const mapIdx = [], goalVals = [];
    for (let r = n - 3; r < n; r++) {
      for (let c = n - 3; c < n; c++) {
        mapIdx.push(r * n + c);
        goalVals.push(r === n - 1 && c === n - 1 ? 0 : r * n + c + 1);
      }
    }
    const state = new Int8Array(9);
    for (let i = 0; i < 9; i++) state[i] = goalVals.indexOf(flat[mapIdx[i]]);

    const heuristic = () => {
      let h = 0;
      for (let i = 0; i < 9; i++) {
        const v = state[i];
        if (v === 8) continue;
        h += Math.abs(((i / 3) | 0) - ((v / 3) | 0)) + Math.abs((i % 3) - (v % 3));
      }
      for (let r = 0; r < 3; r++) {
        for (let c1 = 0; c1 < 3; c1++) {
          const v1 = state[r * 3 + c1];
          if (v1 === 8 || ((v1 / 3) | 0) !== r) continue;
          for (let c2 = c1 + 1; c2 < 3; c2++) {
            const v2 = state[r * 3 + c2];
            if (v2 !== 8 && ((v2 / 3) | 0) === r && v1 > v2) h += 2;
          }
        }
      }
      for (let c = 0; c < 3; c++) {
        for (let r1 = 0; r1 < 3; r1++) {
          const v1 = state[r1 * 3 + c];
          if (v1 === 8 || (v1 % 3) !== c) continue;
          for (let r2 = r1 + 1; r2 < 3; r2++) {
            const v2 = state[r2 * 3 + c];
            if (v2 !== 8 && (v2 % 3) === c && v1 > v2) h += 2;
          }
        }
      }
      return h;
    };

    let blank = state.indexOf(8), ansFirst = -1;
    function dfs(g, bound, prevBlank, firstStep) {
      const h = heuristic();
      const f = g + h;
      if (f > bound) return f;
      if (h === 0) { ansFirst = firstStep; return -1; }
      let min = 1e9;
      const b = blank;
      for (const nb of NBRS_3[b]) {
        if (nb === prevBlank) continue;
        const movedVal = state[nb];
        state[b] = movedVal; state[nb] = 8; blank = nb;
        const t = dfs(g + 1, bound, b, g === 0 ? nb : firstStep);
        state[nb] = movedVal; state[b] = 8; blank = b;
        if (t === -1) return -1;
        if (t < min) min = t;
      }
      return min;
    }

    let bound = heuristic();
    if (bound === 0) return -1;
    // 8-puzzle 最优解上限 31，设 42 为安全冗余；超过则视为异常
    while (bound < 42) {
      const t = dfs(0, bound, -1, -1);
      if (t === -1) return mapIdx[ansFirst];
      if (t === 1e9) break;
      bound = t;
    }
    return -1;
  }

  function findNextMove(flat, n) {
    if (isSolvedFlat(flat)) return -1;
    // 阶段化归约：逐行/逐列锁定已归位前缀，退化到 3×3 时用 IDA* 收尾
    const locked = new Uint8Array(n * n);
    let rTop = 0, cLeft = 0;
    while (n - rTop > 3 || n - cLeft > 3) {
      if (n - rTop >= n - cLeft) {
        let rowDone = true;
        for (let c = cLeft; c < n; c++) if (flat[rTop * n + c] !== rTop * n + c + 1) { rowDone = false; break; }
        if (rowDone) {
          for (let c = cLeft; c < n; c++) locked[rTop * n + c] = 1;
          rTop++;
          continue;
        }
        for (let c = cLeft; c < n - 2; c++) {
          const idx = rTop * n + c;
          if (flat[idx] !== idx + 1) return bfsSubgoal(flat, n, locked, idx + 1, idx, -1, -1);
          locked[idx] = 1;
        }
        const idxA = rTop * n + (n - 2), idxB = rTop * n + (n - 1);
        return bfsSubgoal(flat, n, locked, idxA + 1, idxA, idxB + 1, idxB);
      } else {
        let colDone = true;
        for (let r = rTop; r < n; r++) if (flat[r * n + cLeft] !== r * n + cLeft + 1) { colDone = false; break; }
        if (colDone) {
          for (let r = rTop; r < n; r++) locked[r * n + cLeft] = 1;
          cLeft++;
          continue;
        }
        for (let r = rTop; r < n - 2; r++) {
          const idx = r * n + cLeft;
          if (flat[idx] !== idx + 1) return bfsSubgoal(flat, n, locked, idx + 1, idx, -1, -1);
          locked[idx] = 1;
        }
        const idxA = (n - 2) * n + cLeft, idxB = (n - 1) * n + cLeft;
        return bfsSubgoal(flat, n, locked, idxA + 1, idxA, idxB + 1, idxB);
      }
    }
    return solve3x3(flat, n);
  }

  /* ---------- 游戏状态 ---------- */
  let diff = DIFFS.find(d => d.id === store.get('yk-diff', 'easy')) || DIFFS[0];
  let showMark = store.get('yk-mark', '1') !== '0';
  let size = diff.cols, grid = [], cells = [], blank = [0, 0];
  let steps = 0, history = [], hintsLeft = diff.hints;
  let elapsed = 0, started = false, over = false, hintCell = null, hintTimer = null;
  let lastTick = performance.now();

  const cellAt = (r, c) => cells[r * size + c];
  const toFlat = () => grid.flat();

  function saveGame() {
    if (over) { store.del('yk-state'); return; }
    store.set('yk-state', JSON.stringify({
      diff: diff.id,
      flat: toFlat(),
      steps,
      elapsed: Math.round(elapsed * 10) / 10,
      hintsLeft,
      started
    }));
  }

  function loadSavedGame() {
    try {
      const raw = JSON.parse(store.get('yk-state', 'null'));
      if (!raw || raw.diff !== diff.id || !Array.isArray(raw.flat)) return null;
      const n = diff.cols, len = n * n;
      if (raw.flat.length !== len) return null;
      const seen = new Uint8Array(len);
      for (const v of raw.flat) {
        if (!Number.isInteger(v) || v < 0 || v >= len || seen[v]) return null;
        seen[v] = 1;
      }
      // 拒绝不可解或已通关的脏数据，并校验 hintsLeft/elapsed 合理性
      if (!isSolvable(raw.flat, n) || isSolvedFlat(raw.flat)) return null;
      if (typeof raw.steps !== 'number' || raw.steps < 0 || raw.steps > 1e6) return null;
      if (typeof raw.elapsed !== 'number' || raw.elapsed < 0 || raw.elapsed > 24 * 3600) return null;
      if (raw.hintsLeft != null && (typeof raw.hintsLeft !== 'number' || raw.hintsLeft < 0 || raw.hintsLeft > 32)) return null;
      return raw;
    } catch (e) { return null; }
  }

  /* 渲染 */
  function paint(r, c) {
    const el = cellAt(r, c), v = grid[r][c];
    const isMovable = !over && v !== 0 && (r === blank[0] || c === blank[1]);
    el.classList.remove('shake');
    el.classList.toggle('empty', v === 0);
    el.classList.toggle('movable', isMovable);
    el.classList.toggle('ok', v !== 0 && v === r * size + c + 1);
    el.classList.toggle('hint', !!hintCell && hintCell[0] === r && hintCell[1] === c);
    if (el.firstChild.textContent !== String(v > 0 ? v : '')) el.firstChild.textContent = v > 0 ? v : '';
    const label = `第 ${r + 1} 行第 ${c + 1} 列，` + (v > 0 ? '数字 ' + v : '空白格');
    if (el.getAttribute('aria-label') !== label) el.setAttribute('aria-label', label);
  }
  function paintAll() {
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) paint(r, c);
  }
  // 按钮结构只构建一次，之后仅更新 chip 文本，避免每步重建 DOM 导致闪烁与无谓重排
  function buildTools() {
    hintBtn.innerHTML = ICON.bulb + '<span>提示</span><span class="chip"></span>';
    markBtn.innerHTML = ICON.target + '<span>标位</span><span class="chip"></span>';
  }
  const hintChip = () => hintBtn.querySelector('.chip');
  const markChip = () => markBtn.querySelector('.chip');
  const hudCache = { time: '', steps: -1, hint: '', mark: '' };
  function updateHud() {
    const tt = fmt(elapsed);
    if (tt !== hudCache.time) { timeVal.textContent = tt; hudCache.time = tt; }
    if (hudCache.steps !== steps) { stepVal.textContent = steps; hudCache.steps = steps; }
    subtitle.textContent = `${diff.name} · ${size}×${size}`;
    undoBtn.disabled = !history.length || over;
    hintBtn.disabled = hintsLeft <= 0 || over;
    markBtn.disabled = over;
    gridEl.classList.toggle('mark', showMark);
    markBtn.classList.toggle('active', showMark);
    const ht = String(hintsLeft), mt = showMark ? '开' : '关';
    if (hudCache.hint !== ht) { const c = hintChip(); if (c) c.textContent = ht; hudCache.hint = ht; }
    if (hudCache.mark !== mt) { const c = markChip(); if (c) c.textContent = mt; hudCache.mark = mt; }
  }

  function buildBoard() {
    size = diff.cols;
    boardEl.style.setProperty('--cols', size);
    boardEl.style.setProperty('--rows', size);
    gridEl.innerHTML = '';
    cells = [];
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      const b = document.createElement('button');
      b.className = 'cell'; b.type = 'button'; b.tabIndex = -1;
      b.dataset.r = r; b.dataset.c = c;
      const goal = r === size - 1 && c === size - 1 ? '' : String(r * size + c + 1);
      b.dataset.goal = goal;
      b.style.setProperty('--d', r + c);
      const t = document.createElement('span'); t.className = 'tile';
      b.append(t); gridEl.append(b); cells.push(b);
    }
  }

  function applyFlat(flat) {
    grid = Array.from({ length: size }, (_, r) => flat.slice(r * size, r * size + size));
    const bi = flat.indexOf(0);
    blank = [(bi / size) | 0, bi % size];
  }

  let entranceTimer = null;
  function playEntrance() {
    clearTimeout(entranceTimer);
    gridEl.classList.remove('winning', 'shuffling');
    void gridEl.offsetWidth;
    gridEl.classList.add('shuffling');
    entranceTimer = setTimeout(() => gridEl.classList.remove('shuffling'), 600);
  }

  // 通过随机游走兜底，确保极端情况下也不会出现解态或过易局面
  function randomWalkBoard(flat, n, steps) {
    let blankIdx = flat.indexOf(0);
    let prev = -1;
    for (let s = 0; s < steps; s++) {
      const r = (blankIdx / n) | 0, c = blankIdx % n;
      const cand = [];
      if (r > 0) cand.push(blankIdx - n);
      if (r < n - 1) cand.push(blankIdx + n);
      if (c > 0) cand.push(blankIdx - 1);
      if (c < n - 1) cand.push(blankIdx + 1);
      const filtered = cand.filter(i => i !== prev);
      const nxt = filtered[Math.random() * filtered.length | 0];
      [flat[blankIdx], flat[nxt]] = [flat[nxt], flat[blankIdx]];
      prev = blankIdx; blankIdx = nxt;
    }
    return flat;
  }
  function newGame() {
    clearTimeout(hintTimer);
    buildBoard();
    const len = size * size;
    const minDist = size === 3 ? 8 : size === 4 ? 22 : size === 5 ? 45 : 75;
    const flat = Array.from({ length: len }, (_, i) => i);
    let tries = 0, ok = false;
    do {
      shuffleArr(flat);
      if (!isSolvable(flat, size)) {
        const i = flat[0] ? 0 : 1, j = flat[i + 1] ? i + 1 : i + 2;
        [flat[i], flat[j]] = [flat[j], flat[i]];
      }
      tries++;
      if (!isSolvedFlat(flat) && manhattanTotal(flat, size) >= minDist) { ok = true; break; }
    } while (tries < 40);
    if (!ok) {
      // 40 次随机洗牌仍未命中阈值时，改为从解态随机游走生成（必可解且距离足够）
      for (let i = 0; i < len; i++) flat[i] = i === len - 1 ? 0 : i + 1;
      randomWalkBoard(flat, size, minDist + (Math.random() * 12 | 0));
      if (isSolvedFlat(flat) || manhattanTotal(flat, size) < minDist) {
        randomWalkBoard(flat, size, 20);
      }
    }

    applyFlat(flat);
    steps = 0; history = []; hintCell = null;
    hintsLeft = diff.hints;
    elapsed = 0; started = false; over = false;
    lastTick = performance.now();
    paintAll(); updateHud(); saveGame();
    playEntrance();
  }

  function initGame() {
    const saved = loadSavedGame();
    if (!saved) { newGame(); return; }
    buildBoard();
    applyFlat(saved.flat);
    steps = saved.steps || 0;
    elapsed = saved.elapsed || 0;
    hintsLeft = typeof saved.hintsLeft === 'number' ? saved.hintsLeft : diff.hints;
    started = !!saved.started;
    over = false;
    history = []; hintCell = null;
    lastTick = performance.now();
    paintAll(); updateHud();
    playEntrance();
  }

  /* 难度按钮 */
  const diffBox = $('#diffs');
  function renderDiffs() {
    diffBox.innerHTML = '';
    DIFFS.forEach(d => {
      const b = document.createElement('button');
      b.className = 'chip-btn' + (d.id === diff.id ? ' on' : '');
      b.innerHTML = ICON.check + '<span>' + d.name + '</span>';
      b.title = `${d.cols}×${d.rows}`;
      b.addEventListener('click', () => {
        if (d.id === diff.id) return;
        diff = d;
        store.set('yk-diff', d.id);
        store.del('yk-state');
        renderDiffs();
        newGame();
      });
      diffBox.append(b);
    });
  }

  /* 计时：250ms 心跳，页面隐藏时暂停累计，切回时矫正 lastTick */
  let timerId = null;
  function tickTimer() {
    const now = performance.now();
    if (started && !over && !document.hidden) {
      elapsed += (now - lastTick) / 1000;
      timeVal.textContent = fmt(elapsed);
    }
    lastTick = now;
  }
  timerId = setInterval(tickTimer, 250);
  document.addEventListener('visibilitychange', () => { tickTimer(); saveGame(); });
  window.addEventListener('pagehide', () => { tickTimer(); saveGame(); });
  window.addEventListener('beforeunload', () => { tickTimer(); saveGame(); });

  /* ---------- 滑动与 FLIP 位移动画 ---------- */
  function clearHint() {
    if (!hintCell) return;
    const h = hintCell; hintCell = null; clearTimeout(hintTimer);
    paint(h[0], h[1]);
  }

  function shakeCell(r, c) {
    const el = cellAt(r, c);
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 360);
  }

  function animateMoves(moved) {
    if (REDUCED.matches || !moved.length) return;
    // tile 占据 cell 的 90%（inset 5%），位移按 1/0.9 换算为 tile 自身百分比
    const scale = 100 / 0.9;
    const tiles = moved.map(({ from, to }) => {
      const tile = cellAt(to[0], to[1]).firstChild;
      const dx = ((from[1] - to[1]) * scale).toFixed(4);
      const dy = ((from[0] - to[0]) * scale).toFixed(4);
      tile.style.transition = 'none';
      tile.style.willChange = 'transform';
      tile.style.zIndex = '4';
      tile.style.transform = `translate(${dx}%, ${dy}%)`;
      return tile;
    });
    void gridEl.offsetWidth;
    tiles.forEach(tile => {
      tile.style.transition = 'transform .17s cubic-bezier(.2, .9, .3, 1.05)';
      tile.style.transform = '';
      setTimeout(() => { tile.style.willChange = ''; tile.style.zIndex = ''; tile.style.transition = ''; }, 190);
    });
  }

  /* 将 (r, c) 到空白格之间的所有方块整体推向空白格 */
  function slideFrom(r, c, recordHistory = true) {
    if (over) return false;
    const [br, bc] = blank;
    if ((r === br && c === bc) || (r !== br && c !== bc)) return false;

    clearHint();
    if (!started) { started = true; lastTick = performance.now(); }

    const dr = Math.sign(r - br), dc = Math.sign(c - bc);
    const dist = Math.abs(r - br) + Math.abs(c - bc);
    const moved = [];

    for (let k = 1; k <= dist; k++) {
      const fr = br + dr * k, fc = bc + dc * k;
      const tr = br + dr * (k - 1), tc = bc + dc * (k - 1);
      grid[tr][tc] = grid[fr][fc];
      moved.push({ from: [fr, fc], to: [tr, tc] });
    }
    grid[r][c] = 0;
    if (recordHistory) history.push({ prevBlank: [br, bc], count: dist });
    blank = [r, c];
    steps += dist;

    paintAll();
    animateMoves(moved);
    updateHud();

    if (isSolvedFlat(toFlat())) {
      over = true;
      tickTimer();
      updateHud();
      saveGame();
      gridEl.classList.remove('winning'); void gridEl.offsetWidth; gridEl.classList.add('winning');
      setTimeout(win, REDUCED.matches ? 60 : 520);
    } else {
      saveGame();
    }
    return true;
  }

  /* 按物理滑动方向移动单块（例如向右滑：空白格左侧的方块向右滑入空白格） */
  function slideDir(dr, dc) {
    const tr = blank[0] - dr, tc = blank[1] - dc;
    if (tr < 0 || tr >= size || tc < 0 || tc >= size) return false;
    return slideFrom(tr, tc, true);
  }

  function tapCell(r, c) {
    if (over || grid[r][c] === 0) return;
    if (r !== blank[0] && c !== blank[1]) { shakeCell(r, c); return; }
    slideFrom(r, c, true);
  }

  function undo() {
    if (over || !history.length) return;
    clearHint();
    const { prevBlank, count } = history.pop();
    const [pr, pc] = prevBlank;
    const [br, bc] = blank;
    const dr = Math.sign(pr - br), dc = Math.sign(pc - bc);
    const dist = Math.abs(pr - br) + Math.abs(pc - bc);
    const moved = [];

    for (let k = 1; k <= dist; k++) {
      const fr = br + dr * k, fc = bc + dc * k;
      const tr = br + dr * (k - 1), tc = bc + dc * (k - 1);
      grid[tr][tc] = grid[fr][fc];
      moved.push({ from: [fr, fc], to: [tr, tc] });
    }
    grid[pr][pc] = 0;
    blank = [pr, pc];
    steps = Math.max(0, steps - count);

    paintAll();
    animateMoves(moved);
    updateHud();
    saveGame();
  }

  function showHint() {
    if (over) return;
    /* 若当前已高亮提示块，再次点击直接执行该步，不重复扣除次数 */
    if (hintCell) {
      const [hr, hc] = hintCell;
      slideFrom(hr, hc, true);
      return;
    }
    if (hintsLeft <= 0) { toast('提示次数已用完'); return; }
    const flat = toFlat();
    if (isSolvedFlat(flat)) return;
    const mv = findNextMove(flat, size);
    if (mv < 0) { toast('暂无可提示的下一步'); return; }
    hintsLeft--;
    hintCell = [(mv / size) | 0, mv % size];
    if (!started) { started = true; lastTick = performance.now(); }
    paint(hintCell[0], hintCell[1]);
    clearTimeout(hintTimer);
    hintTimer = setTimeout(clearHint, 3200);
    updateHud();
    saveGame();
  }

  function toggleMark() {
    if (over) return;
    showMark = !showMark;
    store.set('yk-mark', showMark ? '1' : '0');
    updateHud();
  }

  function win() {
    const best = loadBest(), prev = best[diff.id];
    const t = Math.round(elapsed);
    // 首次通关或刷新任一维度均更新对应记录
    const bestTime = !prev || t < prev.time;
    const bestSteps = !prev || steps < prev.steps;
    best[diff.id] = {
      time: bestTime ? t : prev.time,
      steps: bestSteps ? steps : prev.steps,
      wins: (prev ? prev.wins : 0) + 1
    };
    store.set('yk-best', JSON.stringify(best));
    const badgeMsg = !prev || bestTime
      ? '🎉 刷新了最佳成绩!'
      : (bestSteps ? '🎉 刷新了最少步数!' : `最佳成绩 ${fmt(prev.time)} · 最少 ${prev.steps} 步`);
    showDialog({
      icon: ICON.party, title: '恭喜通关!',
      body: `<div class="win-time"><div>${diff.name} · ${size}×${size} 用时</div><div class="big">${fmt(t)}</div>
             <div class="win-meta">共 ${steps} 步</div>
             <div>${badgeMsg}</div></div>`,
      actions: [{ label: '关闭' }, { label: '再来一局', primary: true, onClick: newGame }]
    });
  }

  /* ---------- 指针点击与手势滑动交互（支持触控与鼠标，带指针捕获） ---------- */
  let ptr = null;
  gridEl.addEventListener('pointerdown', e => {
    if (over || e.button > 0) return;
    const cell = e.target.closest('.cell');
    ptr = {
      id: e.pointerId,
      x: e.clientX,
      y: e.clientY,
      r: cell ? +cell.dataset.r : -1,
      c: cell ? +cell.dataset.c : -1,
      moved: false
    };
    try { gridEl.setPointerCapture(e.pointerId); } catch (_) {}
  });
  gridEl.addEventListener('pointermove', e => {
    if (!ptr || e.pointerId !== ptr.id || ptr.moved || over) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    const thresh = Math.max(18, (gridEl.clientWidth / size) * 0.28);
    if (Math.hypot(dx, dy) < thresh) return;
    ptr.moved = true;
    const dr = Math.abs(dx) >= Math.abs(dy) ? 0 : (dy > 0 ? 1 : -1);
    const dc = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 1 : -1) : 0;
    e.preventDefault();
    if (ptr.r >= 0 && grid[ptr.r][ptr.c] !== 0 &&
        Math.sign(blank[0] - ptr.r) === dr && Math.sign(blank[1] - ptr.c) === dc) {
      slideFrom(ptr.r, ptr.c, true);
    } else {
      slideDir(dr, dc);
    }
  });
  gridEl.addEventListener('pointerup', e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const p = ptr; ptr = null;
    try { gridEl.releasePointerCapture(e.pointerId); } catch (_) {}
    if (!p.moved && p.r >= 0) tapCell(p.r, p.c);
  });
  gridEl.addEventListener('pointercancel', e => {
    ptr = null;
    try { gridEl.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  gridEl.addEventListener('lostpointercapture', () => { ptr = null; });

  undoBtn.addEventListener('click', undo);
  restartBtn.addEventListener('click', newGame);
  hintBtn.addEventListener('click', showHint);
  markBtn.addEventListener('click', toggleMark);
  undoBtn.innerHTML = ICON.undo;
  restartBtn.innerHTML = ICON.restart;
  buildTools();

  document.addEventListener('pointerdown', () => root.classList.remove('kb'), true);
  document.addEventListener('keydown', e => {
    if (e.key === 'Tab') root.classList.add('kb');
    // 对话框与弹窗优先级最高，避免底层快捷键误触
    if (e.key === 'Escape' && anyPopOpen()) { e.preventDefault(); closePops(null, true); return; }
    if (dlg.open || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (anyPopOpen()) return;
    const dirs = { ArrowUp: [-1, 0], w: [-1, 0], ArrowDown: [1, 0], s: [1, 0], ArrowLeft: [0, -1], a: [0, -1], ArrowRight: [0, 1], d: [0, 1] };
    if (dirs[k]) { e.preventDefault(); slideDir(...dirs[k]); return; }
    if (k === ' ' || k === 'Enter' || k === 'spacebar') {
      if (e.target.closest && e.target.closest('button, a')) return;
      e.preventDefault();
      if (hintCell) slideFrom(hintCell[0], hintCell[1], true);
    } else if (k === 'h') { e.preventDefault(); showHint(); }
    else if (k === 'z' || (k === 'y' && e.shiftKey)) { e.preventDefault(); undo(); }
    else if (k === 'x') { e.preventDefault(); toggleMark(); }
    else if (k === 'r') { e.preventDefault(); newGame(); }
  });

  /* ---------- 启动 ---------- */
  applyTheme(root.dataset.theme);
  applyPalette(root.dataset.palette || 'purple');
  renderDiffs();
  initGame();
  if (!store.get('yk-seen-help', '')) {
    store.set('yk-seen-help', '1');
    const firstHelp = () => setTimeout(showHelp, 400);
    if (window.YKReady) window.YKReady.whenReady(firstHelp); else firstHelp();
  }
})();
</script>
</body>
</html>
